<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Mercado Confiança — Huambo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <span class="logo" id="logo-nome"></span>
      <a class="btn-cta" id="wa-header" target="_blank" rel="noopener">Fazer pedido</a>
    </div>
  </header>

  <section class="hero">
    <h1 id="hero-nome"></h1>
    <p class="hero-slogan" id="hero-slogan"></p>
    <a class="btn-primary" id="wa-hero" target="_blank" rel="noopener">Encomendar no WhatsApp</a>
  </section>

  <section class="destaques" id="destaques-container"></section>

  <section class="categorias" id="categorias">
    <h2>O que encontra na loja</h2>
    <div class="grid-categorias" id="grid-categorias"></div>
  </section>

  <section class="contacto" id="contacto">
    <h2>Onde estamos</h2>
    <div class="contacto-grid">
      <div class="contacto-info">
        <p><strong>Endereço</strong><br><span id="c-endereco"></span></p>
        <p><strong>Horário</strong><br><span id="c-horario"></span></p>
        <p><strong>Telefone</strong><br><span id="c-telefone"></span></p>
      </div>
      <a class="btn-primary" id="wa-footer" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; <span id="ano"></span> <span id="footer-nome"></span>. Site por Konda.</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
